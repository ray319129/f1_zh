<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PitLingo — F1TV 即時繁體中文字幕</title>
<meta name="description" content="把 F1TV 的英文字幕即時翻譯成繁體中文，雙語疊字顯示。">
<!--
  ⚠️ 這是**暫時的首頁**，不是 Landing Page。
     它的存在只是為了讓 pitlingo.com 的根目錄不是 404
     ——法律文件要能從一個看起來正常的網站連過去，
     Chrome Web Store 審核與使用者都會點進來看。

     正式的 Landing Page（定價、示範影片、購買按鈕）見
     `F1TV_即時繁體中文字幕工具_產品與Launch整合企劃.md`，
     完成後直接覆蓋這個檔案即可，網址結構不用改。
-->
<style>
  :root { color-scheme: light dark; --line: rgba(128,128,128,.25); --dim: rgba(128,128,128,.9); }
  * { box-sizing: border-box; }
  body { font: 16px/1.7 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
  main { max-width: 520px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { font-size: 28px; margin: 18px 0 6px; letter-spacing: .5px; }
  .tag { color: var(--dim); margin: 0 0 28px; }
  .soon { display: inline-block; border: 1px solid var(--line); border-radius: 20px;
          padding: 6px 16px; font-size: 14px; color: var(--dim); margin-bottom: 28px; }
  nav { display: flex; gap: 18px; justify-content: center; font-size: 15px; flex-wrap: wrap; }
  a { color: inherit; }
  footer { margin-top: 40px; font-size: 13px; color: var(--dim); line-height: 1.6; }
  /* 示範影片。`aspect-ratio` + `height:auto` 讓它在任何寬度都不會變形，
     也不會在載入前造成版面跳動（CLS）。 */
  .demo { margin: 0 0 28px; }
  .demo video {
    width: 100%; height: auto; aspect-ratio: 16 / 9;
    border: 1px solid var(--line); border-radius: 10px; background: #000;
  }
  .demo figcaption { font-size: 13px; color: var(--dim); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <img src="/icon128.png" alt="PitLingo">
  <h1>PitLingo</h1>
  <p class="tag">F1TV 英文字幕 → 即時繁體中文</p>

  <div class="soon">即將推出</div>

  <!--
    實際畫面示範。**這是整個頁面最有說服力的東西**——
    「F1TV 英文字幕 → 即時繁體中文」講一百次，都不如讓人看 30 秒。

    ⚠️ `preload="none"` 是必要的：不加的話瀏覽器一進站就開始抓 9 MB，
       手機使用者還沒決定要不要看就先被吃掉流量。
       `poster` 讓沒點播放前也看得到疊字長什麼樣子。
  -->
  <figure class="demo">
    <video controls preload="none" playsinline
           poster="/demo-poster.jpg" width="1280" height="720">
      <source src="/demo.mp4" type="video/mp4">
      您的瀏覽器不支援影片播放，請直接參考上方的畫面截圖。
    </video>
    <figcaption>實際運作畫面（30 秒，含英文原聲）</figcaption>
  </figure>

  <!--
    ⚠️ 這裡曾經同時有兩個「聯絡我們」：一個開 mailto、一個進工單頁。
       同名不同行為是最讓人困惑的一種介面——使用者不知道該按哪個，
       按錯了還會以為自己弄錯。統一成一個入口（工單），
       email 則降為工單頁裡的備援管道。
  -->
  <nav>
    <a href="/buy">購買</a>
    <a href="/terms">使用條款</a>
    <a href="/privacy">隱私權政策</a>
    <a class="cta" href="/contact">✉ 聯絡我們</a>
  </nav>

  <footer>
    PitLingo 為獨立開發的第三方工具，與 Formula 1、FIA 或
    Formula One World Championship Limited 無任何關聯，亦未獲其背書。<br>
    F1、FORMULA 1 等商標均為其所有人之財產。
  </footer>
</main>
</body>
</html>
