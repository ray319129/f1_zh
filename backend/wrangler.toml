name = "f1zh-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 建立 KV：wrangler kv namespace create SUBS
# 然後把回傳的 id 填進來
[[kv_namespaces]]
binding = "SUBS"
id = "606ab33223b74d929d4d0ba8f5e1ae69"

# 機密不寫在這裡，用 wrangler secret put 設定：
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put ADMIN_TOKEN      上傳與後台
#   wrangler secret put TOKEN_SECRET     簽發安裝權杖（未設定時由 ADMIN_TOKEN 衍生）
#   wrangler secret put CLIENT_TOKEN     舊版共用權杖，僅為相容 userscript
#
# 成本熔斷上限（美元／天）。不設定時預設 5。
# 這是 CLIENT_TOKEN 尚未淘汰前唯一的實質防線，務必設定。
[vars]
DAILY_USD_CAP = "5"

# 診斷回報一律存進 KV，後台看得到——那層永遠可靠。
# 填了 REPORT_WEBHOOK 才會額外推一份出去（Email API／Discord／Slack 皆可）。
#
# ⚠️ 從 Cloudflare 寄信到 Gmail 需要**已驗證的寄件網域**（SPF/DKIM）。
#    在 pitlingo.com 設定好之前不要接——送達率會很差甚至直接進垃圾桶，
#    那比沒有更糟，因為你會以為沒人回報。
# REPORT_WEBHOOK = "https://..."
REPORT_TO = "pitlingo.office@gmail.com"

# 金流回呼的驗簽。**沒設定任何一組時 webhook 會拒絕處理**——
# 寧可不發碼，也不要開一個誰都能 POST 一筆假訂單來領授權的窗口。
#   wrangler secret put ECPAY_HASH_KEY
#   wrangler secret put ECPAY_HASH_IV
# 或（自訂金流／測試用）
#   wrangler secret put WEBHOOK_SECRET

# ⚠️ 上線後**不要用 `wrangler deploy`**——那會 100% 立刻切換，出事沒有回頭路。
#    改用漸進式部署：
#      wrangler versions upload
#      wrangler versions deploy        # 指定版本與流量比例
#    回滾就是把比例調回 0，秒級生效。

[observability]
enabled = true
