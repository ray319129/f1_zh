<!doctype html>
<meta charset="utf-8">
<title>PitLingo 成本後台</title>
<!--
  單檔後台。刻意不做建置、不用框架、不部署——用瀏覽器直接開這個檔就好。

  ⚠️ ADMIN_TOKEN 只留在這個分頁的記憶體裡，不寫 localStorage。
     寫進去的話，任何能碰到這台電腦的人都拿得到管理權限。
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.6 system-ui, "Noto Sans TC", sans-serif; margin: 0; padding: 24px;
         max-width: 1000px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .65; margin-bottom: 20px; font-size: 13px; }
  .bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  input, button, select { font: inherit; padding: 7px 10px; border-radius: 6px;
                          border: 1px solid rgba(128,128,128,.45); background: transparent; color: inherit; }
  button { cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { border: 1px solid rgba(128,128,128,.3); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 12px; opacity: .65; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .card.warn { border-color: #d33; }
  .card.warn .v { color: #d33; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(128,128,128,.2); }
  th { font-weight: 600; opacity: .7; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .day { margin-top: 20px; }
  .day h3 { font-size: 14px; margin: 0 0 6px; }
  .hint { font-size: 12px; opacity: .65; margin-top: 6px; }
  #err { color: #d33; white-space: pre-wrap; margin-bottom: 12px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid rgba(128,128,128,.3); }
  .tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 6px 6px 0 0;
         opacity: .55; border-bottom: 2px solid transparent; }
  .tab.on { opacity: 1; font-weight: 600; border-bottom-color: currentColor; }
  .panel { border: 1px solid rgba(128,128,128,.3); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .key { font-family: ui-monospace, monospace; font-size: 20px; letter-spacing: 1px;
         padding: 10px 14px; border-radius: 8px; border: 1px dashed rgba(128,128,128,.5);
         display: inline-block; margin: 8px 0; user-select: all; }
  .danger { border-color: #d33; color: #d33; }
  .okmsg { color: #0a7; }
  .mono { font-family: ui-monospace, monospace; font-size: 13px; }
  .mail { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ops { white-space: nowrap; }
  .ops button { padding: 3px 8px; font-size: 12px; margin-right: 4px; }
  .st-active { color: #0a7; }
  .st-expired { color: #b8730a; }
  .st-revoked { color: #d33; }
  .full { background: rgba(128,128,128,.1); padding: 12px; border-radius: 8px;
          max-height: 460px; overflow: auto; font-size: 12px; white-space: pre-wrap; margin-top: 14px; }
</style>

<h1>PitLingo 成本後台</h1>
<div class="sub">資料來自 <code>GET /v1/admin/stats</code>。權杖只留在這個分頁，不會被儲存。</div>

<div class="bar">
  <input id="base" size="42" value="https://f1zh-api.pitlingo.workers.dev" placeholder="後端網址">
  <input id="tok" type="password" size="30" placeholder="ADMIN_TOKEN">
  <select id="days"><option value="7">近 7 天</option><option value="14">近 14 天</option><option value="31">近 31 天</option></select>
  <button id="go">查詢</button>
</div>

<div class="tabs">
  <button class="tab on" data-t="cost">成本</button>
  <button class="tab" data-t="lic">授權管理</button>
  <button class="tab" data-t="rep">問題回報</button>
</div>

<div id="err"></div>

<section id="p-cost">
  <div id="cards" class="cards"></div>
  <div id="out"></div>
</section>

<section id="p-lic" hidden>
  <div class="panel">
    <h3>發放授權碼</h3>
    <p class="hint">期限由伺服器依方案自動計算：<b>試用</b> 14 天　·　<b>賽季</b> 到隔年 1/31（F1 賽季橫跨年底，用 12/31 會讓最後幾場斷掉）　·　<b>永久</b> 無期限。</p>
    <div class="bar">
      <input id="li-mail" size="24" placeholder="買家 email（強烈建議填）">
      <select id="li-plan"><option value="season">賽季</option><option value="lifetime">永久</option><option value="trial">試用 14 天</option></select>
      <input id="li-order" size="14" placeholder="訂單編號">
      <button id="li-go">發碼</button>
    </div>
    <div id="li-out"></div>
  </div>

  <div class="panel">
    <h3>所有授權碼</h3>
    <div class="bar">
      <input id="ll-q" size="26" placeholder="搜尋授權碼 / email / 訂單編號">
      <select id="ll-status">
        <option value="all">全部狀態</option>
        <option value="active">有效</option>
        <option value="expired">已過期</option>
        <option value="revoked">已停用</option>
      </select>
      <button id="ll-go">重新整理</button>
    </div>
    <div id="ll-out"></div>
  </div>
</section>

<section id="p-rep" hidden>
  <div class="panel">
    <h3>問題回報</h3>
    <p class="hint">使用者在擴充功能按「傳送診斷」就會出現在這裡，保留 90 天。使用者手上有工單編號，對得起來。</p>
    <div class="bar"><button id="rp-go">重新整理</button></div>
    <div id="rp-out"></div>
  </div>
</section>

</section>

<script>
const $ = (id) => document.getElementById(id);

// ADMIN_TOKEN 只留在這個分頁的記憶體。不寫 localStorage——
// 寫進去的話，任何能碰到這台電腦的人都拿得到管理權限。
async function apiCall(path, opts) {
  const base = $('base').value.replace(/\/+$/, '');
  const res = await fetch(base + path, Object.assign({
    headers: { 'content-type': 'application/json', 'x-admin-token': $('tok').value },
  }, opts || {}));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

document.querySelectorAll('.tab').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
    $('p-cost').hidden = b.dataset.t !== 'cost';
    $('p-lic').hidden = b.dataset.t !== 'lic';
    $('p-rep').hidden = b.dataset.t !== 'rep';
    if (b.dataset.t === 'lic' && !llRows.length) loadLicenses();
    if (b.dataset.t === 'rep') $('rp-go').click();
  };
});

$('li-go').onclick = async () => {
  $('err').textContent = ''; $('li-out').innerHTML = '發放中…';
  try {
    const d = await apiCall('/v1/admin/license/issue', {
      method: 'POST',
      body: JSON.stringify({ email: $('li-mail').value.trim(), plan: $('li-plan').value, orderId: $('li-order').value.trim() }),
    });
    $('li-out').innerHTML = `<div class="okmsg">已發放（${d.plan}）。把這組碼寄給買家：</div>
      <div class="key">${d.licenseKey}</div>
      <div class="hint">${d.expiresAt ? '到期日 ' + new Date(d.expiresAt * 1000).toISOString().slice(0, 10) : '無使用期限'}　·　使用者在擴充功能的設定頁貼上即可啟用，最多 3 台裝置。</div>`;
    loadLicenses();
  } catch (e) { $('li-out').innerHTML = ''; $('err').textContent = String(e.message || e); }
};


// ---- 授權清單 ----
// 一組一組查在量大之後完全不能用。這裡直接列出全部，可搜尋、可就地操作。
let llRows = [];

async function loadLicenses() {
  $('err').textContent = '';
  $('ll-out').innerHTML = '載入中…';
  try {
    const d = await apiCall('/v1/admin/license/list?q=' + encodeURIComponent($('ll-q').value.trim())
      + '&status=' + $('ll-status').value);
    llRows = d.rows;
    renderLicenses(d);
  } catch (e) { $('ll-out').innerHTML = ''; $('err').textContent = String(e.message || e); }
}

function fmtDay(sec) { return sec ? new Date(sec * 1000).toISOString().slice(0, 10) : '無期限'; }

const STATE_LABEL = { active: '有效', expired: '已過期', revoked: '已停用' };

function renderLicenses(d) {
  if (!llRows.length) { $('ll-out').innerHTML = '<div class="hint">沒有符合條件的授權碼。</div>'; return; }
  $('ll-out').innerHTML = `<table>
    <tr><th>授權碼</th><th>方案</th><th>到期</th><th class="num">裝置</th><th>email</th><th>狀態</th><th>操作</th></tr>
    ${llRows.map((r, i) => `<tr>
      <td class="mono">${r.licenseKey}</td>
      <td>${r.planLabel}</td>
      <td>${fmtDay(r.expiresAt)}</td>
      <td class="num">${r.devices}</td>
      <td class="mail">${r.email || '—'}</td>
      <td class="st-${r.state}">${STATE_LABEL[r.state]}</td>
      <td class="ops">
        <button data-a="extend" data-i="${i}" class="secondary">+30 天</button>
        <button data-a="clear" data-i="${i}" class="secondary">清空裝置</button>
        <button data-a="toggle" data-i="${i}" class="${r.state === 'revoked' ? 'secondary' : 'danger'}">${r.state === 'revoked' ? '恢復' : '停用'}</button>
      </td></tr>`).join('')}
    </table>
    ${d && d.complete === false ? '<div class="hint">資料超過一頁，請用搜尋縮小範圍。</div>' : ''}`;

  $('ll-out').querySelectorAll('button[data-a]').forEach((b) => {
    b.onclick = () => licenseAction(b.dataset.a, llRows[Number(b.dataset.i)], b);
  });
}

async function licenseAction(action, row, btn) {
  const payload = { licenseKey: row.raw };
  if (action === 'extend') payload.extendDays = 30;
  if (action === 'clear') {
    if (!confirm(`清空 ${row.licenseKey} 的所有裝置？
使用者需要重新啟用（授權碼本身不受影響）。`)) return;
    payload.clearDevices = true;
  }
  if (action === 'toggle') {
    const on = row.state !== 'revoked';
    // 停用會讓使用者在 24 小時內失去存取，一定要再問一次
    if (on && !confirm(`停用 ${row.licenseKey}？
使用者會在 24 小時內失去存取權。`)) return;
    payload.revoked = on;
  }
  btn.disabled = true;
  try {
    await apiCall('/v1/admin/license/patch', { method: 'POST', body: JSON.stringify(payload) });
    await loadLicenses();
  } catch (e) { btn.disabled = false; $('err').textContent = String(e.message || e); }
}

$('ll-go').onclick = loadLicenses;
$('ll-q').onkeydown = (e) => { if (e.key === 'Enter') loadLicenses(); };
$('ll-status').onchange = loadLicenses;

// ---- 問題回報 ----
$('rp-go').onclick = async () => {
  $('err').textContent = '';
  $('rp-out').innerHTML = '載入中…';
  try {
    const d = await apiCall('/v1/admin/reports');
    $('rp-out').innerHTML = d.rows.length ? `<table>
      <tr><th>工單</th><th>時間</th><th>版本</th><th>使用者說明</th><th>聯絡方式</th><th></th></tr>
      ${d.rows.map((r) => `<tr>
        <td class="mono">${r.id}</td>
        <td>${new Date(r.at * 1000).toLocaleString('zh-TW')}</td>
        <td>${r.version || '—'}</td>
        <td>${r.note || '—'}</td>
        <td class="mail">${r.contact || '—'}</td>
        <td><button class="secondary" data-rid="${r.id}">看全文</button></td>
      </tr>`).join('')}
      </table><pre id="rp-full" class="full" hidden></pre>`
      : '<div class="hint">目前沒有任何回報。</div>';

    $('rp-out').querySelectorAll('button[data-rid]').forEach((b) => {
      b.onclick = async () => {
        const pre = $('rp-full');
        pre.hidden = false; pre.textContent = '載入中…';
        try {
          const full = await apiCall('/v1/admin/reports?id=' + encodeURIComponent(b.dataset.rid));
          pre.textContent = full.report;
          pre.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch (e) { pre.textContent = String(e.message || e); }
      };
    });
  } catch (e) { $('rp-out').innerHTML = ''; $('err').textContent = String(e.message || e); }
};

const usd = (n) => '$' + Number(n || 0).toFixed(4);
const pct = (n) => n == null ? '—' : (n * 100).toFixed(1) + '%';

function card(k, v, warn) {
  return `<div class="card${warn ? ' warn' : ''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
}

$('go').onclick = async () => {
  $('err').textContent = '';
  $('out').innerHTML = '';
  $('cards').innerHTML = '查詢中…';
  try {
    render(await apiCall('/v1/admin/stats?days=' + $('days').value));
  } catch (e) {
    $('cards').innerHTML = '';
    $('err').textContent = String(e.message || e);
  }
};

function render(d) {
  const t = d.total, b = d.budget;
  const overRatio = b.dailyCapUsd ? b.todayUsd / b.dailyCapUsd : 0;

  $('cards').innerHTML = [
    card('今日成本', usd(b.todayUsd) + ' / ' + usd(b.dailyCapUsd), overRatio >= 0.8),
    card(`近 ${d.days} 天成本`, usd(t.usd)),
    // 這是整個商業模式的分母：命中率越高，每位使用者的邊際成本越接近 0
    card('共用快取命中率', pct(t.sharedHitRate)),
    // 掉下來代表 SYSTEM_PROMPT 又低於 4,096 tokens（坑 #21），
    // 那是「每次全額計費卻完全不報錯」的狀態
    card('Prompt 快取命中率', pct(t.promptCacheHitRate), t.promptCacheHitRate != null && t.promptCacheHitRate < 0.5),
    card('每句翻譯成本', t.usdPerTranslatedLine == null ? '—' : '$' + t.usdPerTranslatedLine.toFixed(6)),
    card('翻譯句數', t.translated.toLocaleString()),
  ].join('');

  $('out').innerHTML = d.daily.filter((x) => x.videos.length).map((day) => `
    <div class="day">
      <h3>${day.date}　${usd(day.usd)}</h3>
      <table>
        <tr><th>contentId</th><th class="num">成本</th><th class="num">翻譯</th><th class="num">快取命中</th><th class="num">呼叫</th></tr>
        ${day.videos.map((v) => `<tr>
          <td>${v.cid}</td><td class="num">${usd(v.usd)}</td>
          <td class="num">${v.translated}</td><td class="num">${v.cached}</td><td class="num">${v.calls}</td>
        </tr>`).join('')}
      </table>
    </div>`).join('')
    || '<div class="hint">這段期間沒有翻譯紀錄。</div>';

  if (t.promptCacheHitRate != null && t.promptCacheHitRate < 0.5) {
    $('out').insertAdjacentHTML('afterbegin',
      '<div class="hint" style="color:#d33">⚠ Prompt 快取命中率偏低。'
      + '請跑 <code>node tools/check-prompt.js</code> 確認 SYSTEM_PROMPT 仍在 4,096 tokens 之上——'
      + '低於門檻時 cache_control 會靜默失效，每次全額計費。</div>');
  }
}
</script>
